version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: betting_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  django:
    build: .
    container_name: betting_django
    restart: always
    env_file:
      - .env
    environment:
      - FOOTBALL_API_KEY=${FOOTBALL_API_KEY}
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  executor:
    build: .
    container_name: betting_executor
    restart: always
    env_file:
      - .env
    command: python run_bot.py
    volumes:
      - .:/app
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - db
      - django

volumes:
  postgres_data: